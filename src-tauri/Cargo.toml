[package]
name = "kagami-no-konata"
version = "0.1.0"
description = "Kagami no Konata — a local-first desktop AI companion"
authors = ["Kagami no Konata Contributors"]
edition = "2021"

[lib]
name = "kagami_no_konata_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
anyhow = "1"
futures = "0.3"
async-trait = "0.1"
bytes = "1"
regex = "1"
globset = "0.4.20"
walkdir = "2.5.0"

# Windows 回收站：走系统 IFileOperation（Linux/macOS 使用 trash.rs 自带的
# XDG / ~/.Trash 实现，不引入本依赖）。放在 target 依赖里保证其它平台
# 不会编译到 COM 绑定。
[target.'cfg(windows)'.dependencies]
trash = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

